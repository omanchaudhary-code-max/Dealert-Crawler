name: Daily Daraz Price Crawl

on:
  schedule:
    - cron: '45 20 * * *'
  workflow_dispatch:

concurrency:
  group: sptdas-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('Crawler/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install matched Chrome for Testing + ChromeDriver
        run: |
          set -e
          JSON_URL="https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json"
          CHROME_URL=$(curl -s "$JSON_URL" | jq -r '.channels.Stable.downloads.chrome[] | select(.platform=="linux64") | .url')
          DRIVER_URL=$(curl -s "$JSON_URL" | jq -r '.channels.Stable.downloads.chromedriver[] | select(.platform=="linux64") | .url')

          echo "Chrome URL:  $CHROME_URL"
          echo "Driver URL:  $DRIVER_URL"

          mkdir -p "$HOME/cft"
          curl -sL "$CHROME_URL" -o /tmp/chrome.zip
          curl -sL "$DRIVER_URL" -o /tmp/chromedriver.zip
          unzip -q /tmp/chrome.zip -d "$HOME/cft"
          unzip -q /tmp/chromedriver.zip -d "$HOME/cft"

          CHROME_BIN=$(find "$HOME/cft" -type f -name "chrome" | head -1)
          CHROMEDRIVER_BIN=$(find "$HOME/cft" -type f -name "chromedriver" | head -1)
          chmod +x "$CHROME_BIN" "$CHROMEDRIVER_BIN"

          echo "CHROME_BINARY_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER_PATH=$CHROMEDRIVER_BIN" >> "$GITHUB_ENV"

          "$CHROME_BIN" --version
          "$CHROMEDRIVER_BIN" --version

      - name: Install Python dependencies
        working-directory: ./Crawler
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler
        working-directory: ./Crawler
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB: ${{ secrets.MONGO_DB }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          DELAY_MIN: 10
          DELAY_MAX: 20
          MAX_PRODUCTS_PER_CATEGORY: 15
          CATEGORIES: laptops,smartphones,televisions,earphones-headsets,mens-shoes,womens-shoes,mens-t-shirts,books,kitchen-appliances,cameras
          CRAWL_MODE: discovery
          LOG_LEVEL: INFO
        run: python run_now.py

      - name: Upload crawler log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: crawler-log-${{ github.run_number }}
          path: |
            Crawler/logs/crawler.log
            Crawler/logs/debug/**
          retention-days: 30